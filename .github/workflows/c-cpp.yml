name: C Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install GCC
      run: sudo apt-get update && sudo apt-get install -y gcc

    - name: Compile all C files
      run: |
        mkdir -p build
        find . -name "*.c" -exec sh -c 'gcc "$1" -o "build/$(basename "${1%.c}")"' _ {} \;

    - name: Show compiled files
      run: ls -l build
